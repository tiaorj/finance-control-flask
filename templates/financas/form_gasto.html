{% extends "base.html" %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7 col-xl-6">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white">
                    <div class="small text-white-50 fw-bold text-uppercase">Controle Financeiro - {{ mes }}/{{ ano }}</div>
                    <h4 class="mb-0 fw-bold"><i class="bi bi-plus-circle me-2"></i>Novo Gasto</h4>
                </div>
                <div class="card-body p-4">
                    <form method="POST" action="{{ url_for('financas.adicionar_gasto') }}">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <input type="hidden" name="mes" value="{{ mes }}">
                        <input type="hidden" name="ano" value="{{ ano }}">

                        <div class="mb-3">
                            <label class="form-label fw-bold">Descrição</label>
                            <input type="text" name="descricao" class="form-control" placeholder="Ex: Conta de luz" required>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Categoria</label>
                                <select name="categoria_id" class="form-select" required>
                                    <option value="">Selecione...</option>
                                    {% for cat in categorias %}
                                        <option value="{{ cat.CategoriaId }}">{{ cat.Nome }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Valor Estimado</label>
                                <div class="input-group">
                                    <span class="input-group-text">R$</span>
                                    <input type="text" name="valor_estimado" class="form-control" placeholder="0,00" required>
                                </div>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">Data de Vencimento</label>
                            <input type="date" name="data_vencimento" class="form-control" required>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary fw-bold">
                                <i class="bi bi-check-circle me-1"></i>Salvar Lançamento
                            </button>
                            <a href="{{ url_for('financas.dashboard', mes=mes, ano=ano) }}" class="btn btn-light">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
