{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="fw-bold text-uppercase mb-0">Perfil do <span class="text-primary-custom">Currículo</span></h2>
                <a href="{{ url_for('curriculo.especialista') }}" class="btn btn-sm btn-outline-secondary">
                    <i class="bi bi-arrow-left"></i> Voltar
                </a>
            </div>

            <form method="POST" enctype="multipart/form-data" class="card shadow-sm border-0">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <input type="hidden" name="foto_arquivo_atual" value="{{ perfil.foto_arquivo }}">
                <div class="card-body p-4">
                    <div class="row g-3">
                        <div class="col-md-7">
                            <label class="form-label small fw-bold text-uppercase">Nome de exibição</label>
                            <input type="text" name="nome" class="form-control" value="{{ perfil.nome }}" required>
                        </div>
                        <div class="col-md-5">
                            <label class="form-label small fw-bold text-uppercase">Cargo / headline</label>
                            <input type="text" name="cargo" class="form-control" value="{{ perfil.cargo }}">
                        </div>

                        <div class="col-12">
                            <label class="form-label small fw-bold text-uppercase">Resumo profissional</label>
                            <textarea name="resumo" class="form-control" rows="4">{{ perfil.resumo }}</textarea>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-uppercase">Localização</label>
                            <input type="text" name="localizacao" class="form-control" value="{{ perfil.localizacao }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-uppercase">Telefone</label>
                            <input type="text" name="telefone" class="form-control" value="{{ perfil.telefone }}">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-uppercase">E-mail</label>
                            <input type="email" name="email" class="form-control" value="{{ perfil.email }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-uppercase">LinkedIn</label>
                            <input type="text" name="linkedin" class="form-control" value="{{ perfil.linkedin }}" placeholder="linkedin.com/in/seu-perfil">
                        </div>

                        <div class="col-12">
                            <label class="form-label small fw-bold text-uppercase">Foto do perfil</label>
                            <div class="d-flex align-items-center gap-3">
                                {% if perfil.foto_arquivo %}
                                <img src="{{ url_for('static', filename=perfil.foto_arquivo) }}" class="rounded-circle border" style="width: 72px; height: 72px; object-fit: cover;">
                                {% else %}
                                <div class="rounded-circle border bg-light d-flex align-items-center justify-content-center text-muted" style="width: 72px; height: 72px;">
                                    <i class="bi bi-person fs-2"></i>
                                </div>
                                {% endif %}
                                <input type="file" name="foto" class="form-control" accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp">
                            </div>
                        </div>
                    </div>
                </div>
                <div class="card-footer bg-white border-0 p-4 pt-0">
                    <button type="submit" class="btn btn-primary-custom w-100 fw-bold py-3">
                        <i class="bi bi-save me-2"></i>Salvar perfil
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
