{% extends "base.html" %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="fw-bold text-uppercase mb-0">
                    {% if assinatura %}Editar{% else %}Nova{% endif %} <span class="text-primary-custom">Assinatura</span>
                </h2>
                <a href="{{ url_for('assinaturas.lista') }}" class="btn btn-sm btn-outline-secondary">
                    <i class="bi bi-arrow-left"></i> Voltar
                </a>
            </div>

            <form method="POST" class="card shadow-sm border-0">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="card-body p-4">
                    <div class="row g-3">
                        <div class="col-md-7">
                            <label class="form-label small fw-bold text-uppercase">Serviço</label>
                            <input type="text" name="nome" class="form-control" value="{{ assinatura.Nome if assinatura else '' }}" placeholder="Netflix, Spotify, iCloud..." required>
                        </div>
                        <div class="col-md-5">
                            <label class="form-label small fw-bold text-uppercase">Categoria</label>
                            <input type="text" name="categoria" class="form-control" value="{{ assinatura.Categoria if assinatura else '' }}" placeholder="Streaming, Software, Academia">
                        </div>

                        <div class="col-md-4">
                            <label class="form-label small fw-bold text-uppercase">Valor</label>
                            <div class="input-group">
                                <span class="input-group-text">R$</span>
                                <input type="text" name="valor" class="form-control" value="{{ (assinatura.Valor or 0)|formato_real if assinatura else '' }}" placeholder="39,90" required>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small fw-bold text-uppercase">Ciclo</label>
                            <select name="ciclo" class="form-select">
                                <option value="mensal" {% if not assinatura or assinatura.Ciclo == 'mensal' %}selected{% endif %}>Mensal</option>
                                <option value="anual" {% if assinatura and assinatura.Ciclo == 'anual' %}selected{% endif %}>Anual</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small fw-bold text-uppercase">Próxima renovação</label>
                            <input type="date" name="data_renovacao" class="form-control"
                                   value="{{ assinatura.DataRenovacao.strftime('%Y-%m-%d') if assinatura and assinatura.DataRenovacao and not assinatura.DataRenovacao is string else assinatura.DataRenovacao if assinatura and assinatura.DataRenovacao is string else '' }}"
                                   required>
                        </div>

                        <div class="col-12">
                            <label class="form-label small fw-bold text-uppercase">Observações</label>
                            <textarea name="observacoes" class="form-control" rows="3" placeholder="Plano, usuário, cartão usado ou lembrete importante.">{{ assinatura.Observacoes if assinatura else '' }}</textarea>
                        </div>

                        <div class="col-12">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" role="switch" id="ativa" name="ativa"
                                       {% if not assinatura or assinatura.Ativa %}checked{% endif %}>
                                <label class="form-check-label fw-bold" for="ativa">Assinatura ativa</label>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="card-footer bg-white border-0 p-4 pt-0">
                    <button type="submit" class="btn btn-primary-custom w-100 fw-bold py-3">
                        <i class="bi bi-save me-2"></i>Salvar Assinatura
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
