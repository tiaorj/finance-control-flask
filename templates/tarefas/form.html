{% extends "base.html" %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="fw-bold text-uppercase mb-0">
                    {% if tarefa %}Editar{% else %}Nova{% endif %} <span class="text-primary-custom">Tarefa</span>
                </h2>
                <a href="{{ url_for('tarefas.lista') }}" class="btn btn-sm btn-outline-secondary">
                    <i class="bi bi-arrow-left"></i> Voltar
                </a>
            </div>

            <form method="POST" class="card shadow-sm border-0">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="card-body p-4">
                    <div class="row g-3">
                        <div class="col-md-8">
                            <label class="form-label small fw-bold text-uppercase">Titulo</label>
                            <input type="text" name="titulo" class="form-control" value="{{ tarefa.Titulo if tarefa else '' }}" placeholder="Limpar filtro do ar, pagar IPTU, renovar seguro..." required>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label small fw-bold text-uppercase">Categoria</label>
                            <select name="categoria" class="form-select">
                                {% for categoria in categorias %}
                                    <option value="{{ categoria }}" {% if tarefa and tarefa.Categoria == categoria %}selected{% endif %}>{{ categoria }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label small fw-bold text-uppercase">Periodicidade</label>
                            <select name="periodicidade" id="periodicidade" class="form-select">
                                {% for valor, item in periodicidades.items() %}
                                    <option value="{{ valor }}" {% if tarefa and tarefa.Periodicidade == valor %}selected{% endif %}>{{ item.label }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label small fw-bold text-uppercase">Intervalo em meses</label>
                            <input type="number" name="intervalo_meses" id="intervalo_meses" class="form-control" min="1" value="{{ tarefa.IntervaloMeses if tarefa else 1 }}">
                        </div>

                        <div class="col-md-4">
                            <label class="form-label small fw-bold text-uppercase">Proxima data</label>
                            <input type="date" name="proxima_data" class="form-control"
                                   value="{{ tarefa.ProximaData.strftime('%Y-%m-%d') if tarefa and tarefa.ProximaData and not tarefa.ProximaData is string else tarefa.ProximaData if tarefa and tarefa.ProximaData is string else '' }}" required>
                        </div>

                        <div class="col-12">
                            <label class="form-label small fw-bold text-uppercase">Observacoes</label>
                            <textarea name="observacoes" class="form-control" rows="3">{{ tarefa.Observacoes if tarefa else '' }}</textarea>
                        </div>

                        <div class="col-12">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" role="switch" id="ativa" name="ativa"
                                       {% if not tarefa or tarefa.Ativa %}checked{% endif %}>
                                <label class="form-check-label fw-bold" for="ativa">Tarefa ativa</label>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="card-footer bg-white border-0 p-4 pt-0">
                    <button type="submit" class="btn btn-primary-custom w-100 fw-bold py-3">
                        <i class="bi bi-save me-2"></i>Salvar Tarefa
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
const intervalosPadrao = {
    mensal: 1,
    bimestral: 2,
    trimestral: 3,
    semestral: 6,
    anual: 12
};

function sincronizarIntervalo() {
    const periodicidade = document.getElementById('periodicidade');
    const intervalo = document.getElementById('intervalo_meses');

    if (!periodicidade || !intervalo) return;

    const valor = periodicidade.value;
    const ehPersonalizado = valor === 'personalizado';

    if (!ehPersonalizado) {
        intervalo.value = intervalosPadrao[valor] || 1;
    }

    intervalo.readOnly = !ehPersonalizado;
}

document.getElementById('periodicidade')?.addEventListener('change', sincronizarIntervalo);
window.addEventListener('DOMContentLoaded', sincronizarIntervalo);
</script>
{% endblock %}
